apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
spec:
  replicas: 1
  selector:
    matchLabels: {app: laravel}
  template:
    metadata:
      labels: {app: laravel}
    spec:
      containers:
      - name: laravel
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command: ["sh","-c","until php artisan migrate --force; do echo waiting for db; sleep 5; done; apache2-foreground"]
        ports:
        - containerPort: 80
        env:
        - {name: APP_ENV, value: production}
        - {name: APP_DEBUG, value: "false"}
        - {name: LOG_CHANNEL, value: stderr}
        - {name: DB_CONNECTION, value: mysql}
        - {name: DB_HOST, value: mysql}
        - {name: DB_PORT, value: "3306"}
        - {name: DB_DATABASE, value: laravel}
        - {name: DB_USERNAME, value: laravel}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: laravel-secret, key: DB_PASSWORD}}
        - name: APP_KEY
          valueFrom: {secretKeyRef: {name: laravel-secret, key: APP_KEY}}
---
apiVersion: v1
kind: Service
metadata:
  name: laravel
spec:
  type: NodePort
  selector: {app: laravel}
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
